server {
    listen 443 ssl;
    server_name oiiai.himesama.dev;

    ssl_certificate /etc/letsencrypt/live/oiiai.himesama.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oiiai.himesama.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    error_page 497 https://$host:52013$request_uri;

    location / {
        proxy_pass http://php:8829;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/js/ {
        proxy_pass http://nodejs:5354/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    location /api/py/ {
        proxy_pass http://python:9538/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
